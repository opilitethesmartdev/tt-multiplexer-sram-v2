pdk:
  name: 'gf180mcuD'
  tech: 'gf180mcuD'
  scale: 2000
  die:
    # Match the hackclub-asic-pg openframe_project_wrapper DIEAREA.
    width:  3166630
    height: 4766630
    margin:
      # The horizontal margin sets how much of the die width is left to the
      # block grid. Each column must hold a full user tile (346.64um, 619
      # sites) plus the power gate (11.2um) and the block margins, so with
      # the SKY130-style 85um margin every column came up 4.5um short and the
      # hardened user macros overflowed into their neighbours. 62um still
      # leaves generous clearance to the boundary pins (whose metal sits at
      # x -2..0.3) and makes 1x1 slots 348.32um and 2x2 slots 714.56um.
      left:   62000
      right:  62000
      top:    85000
      bottom: 85000
  site:
    width:  560
    height: 3920
  pwrgate:
    vdd:
      name: tt_pg_3v3
      width: 11200
      variants: ['hp']
    vaa:
      name: tt_pg_5v0
      width: 14560
  analog:
    switch:
      name: tt_asw_5v0
      width: 40320
      height: 30250
    pad:
      width: 3000
  tracks:
    Metal1:
      x:
        offset: 230
        pitch:  560
        width:  230
      y:
        offset: 230
        pitch:  560
        width:  230
    Metal2:
      x:
        offset: 280
        pitch:  560
        width:  280
      y:
        offset: 280
        pitch:  560
        width:  280
    Metal3:
      x:
        offset: 280
        pitch:  560
        width:  280
      y:
        offset: 280
        pitch:  560
        width:  280
    Metal4:
      x:
        offset: 280
        pitch:  560
        width:  280
      y:
        offset: 280
        pitch:  560
        width:  280
    Metal5:
      x:
        offset: 450
        pitch:  900
        width:  440
      y:
        offset: 450
        pitch:  900
        width:  440
tt:
  grid:     # In number of blocks
    x:  8   # Must be divisible by 4
    y: 16   # Must be EVEN
  sram:
    addr_width: 9
    data_width: 32
    wmask_width: 4
    # Branches whose mux carries the shared SRAM sideband: 4 branches x 8
    # tiles = 32 SRAM-capable tiles. The memory itself is the 4x4 block at
    # x 0-3, rows 9-12 (it covers half of branches 1 and 9 and all of 5, so 5
    # has no mux). The four full branches next to it:
    #    3 = right, rows 8-9     7 = right, rows 10-11
    #   11 = right, rows 12-13  13 = left, rows 14-15 (above the memory)
    # 15 is not used: Hack Club reserves it for huge modules.
    # 7 used to be an analog group inherited from Sky130; GF180 has no analog
    # switches, so that branch had no mux and no use.
    # All four are odd branches, so they share the top SRAM bus spine.
    # Each enabled branch costs 79 sideband wires to its mux.
    branches: [3, 7, 11, 13]
  block:
    w: -1
    h: -1
  margin:   # In 'sites'
    x: 6
    y: 1
  uio:
    ae: 22
    au:  8
    i:  10
    o:   8
    io:  8
  spine:
    vlayer: 'Metal4'
    hlayer: 'Metal3'
  analog:
    - mux_id: [ 10 ]
      pins:
        0:   978500
        1:  1189500
        2:  1400500
        3:  1611500
        4:  1822500
        5:  2033500
    # Kept without a mux: the 4x4 shared-SRAM block sits on this branch.
    - mux_id: [ 5 ]
      pins:
        12: 3721500
        13: 3510500
        14: 3299500
        15: 3088500
    - mux_id: [ 4 ]
      pins:
        16: 2455500
        17: 2244500
        18: 2033500
        19: 1822500
        20: 1611500
        21: 1400500
  huge_modules:
    mux_id: [ 12, 15 ]
  logo:
    tt_logo_top:
      width: 65000
      height: 65000
      x:
        align: 'center'
        anchor: 'spine.center'
      y:
        align: 'top'
        anchor: 'top_level.top'
        offset: -3920
    tt_logo_bottom:
      width: 65000
      height: 65000
      x:
        align: 'center'
        anchor: 'spine.center'
      y:
        align: 'bottom'
        anchor: 'top_level.bottom'
        offset: 3920
    # The two corner logos are the only decorative macros that would sit on the
    # core power grid: the vdpwr/vgnd core ring bars run up to y=4598 and the
    # logos start at y=4520/4576 in the top corners, and every one of these
    # macros is a solid Metal1..Metal5 block with no pins. A ring bar crossing
    # one is a dead short (it tied vapwr to vgnd in extraction). They are moved
    # into the free part of the top margin, clear of the ring bars (x<56 and
    # x>3110) and of the pad straps (y>4745).
    tt_logo_corner_tl:
      width: 164000
      height: 164000
      x:
        offset: 2000000
      y:
        anchor: 'die.top'
        align: 'top'
        offset: -26000
    tt_logo_corner_tr:
      width: 220000
      height: 220000
      x:
        offset: 2250000
      y:
        anchor: 'die.top'
        align: 'top'
        offset: -26000
    gf180mcu_ws_ip__project_id:
      width: 195500
      height: 59500
      x:
        offset: 175600
      y:
        offset: 26000
    gf180mcu_ws_ip__qrcode_id:
      width: 142800
      height: 142800
      x:
        offset: 28800
      y:
        offset: 28800
    gf180mcu_ws_ip__shuttle_id:
      width: 195500
      height: 59500
      orient: 'E'
      x:
        offset: 26000
      y:
        offset: 175600
    gf180mcu_ws_ip__logo:
      width: 143250
      height: 143250
      x:
        anchor: 'die.right'
        align: 'right'
        offset: -26000
      y:
        offset: 26000
